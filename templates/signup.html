{% extends "base.html" %}

{% block title %}Sign Up — StudyMate AI Workspace{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-container">
    
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon">⚡</div>
        <h2>Create an Account</h2>
        <p>Start your journey to studying 3x faster with AI.</p>
      </div>

      <!-- Error message -->
      {% if error %}
      <div class="auth-alert error">
        <i data-feather="alert-circle"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
        <div class="form-group">
          <label for="username">Full Name</label>
          <div class="input-wrapper">
            <i data-feather="user"></i>
            <input type="text" id="username" name="username" placeholder="Raja Swami" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i data-feather="mail"></i>
            <input type="email" id="email" name="email" placeholder="raja@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i data-feather="lock"></i>
            <input type="password" id="password" name="password" placeholder="Min. 6 characters" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn-auth-submit">
          <span>Create Account</span>
          <i data-feather="arrow-right" style="width: 16px; height: 16px;"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a>.</p>
      </div>
    </div>

  </div>
</section>
{% endblock %}
